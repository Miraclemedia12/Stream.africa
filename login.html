<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Stream Africa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        
        :root { 
            --stream-green: #b8d5b0; 
            --stream-dark: #0a1f1c; 
        }

        body { 
            background: var(--stream-dark); 
            color: #fff; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-image: radial-gradient(circle at 50% 50%, rgba(184, 213, 176, 0.05) 0%, transparent 100%);
        }

        .glass { 
            background: rgba(255,255,255,0.02); 
            border: 2px solid rgba(184, 213, 176, 0.15); 
            backdrop-filter: blur(15px); 
        }

        input { 
            background: rgba(255,255,255,0.05) !important; 
            border: 1px solid rgba(184, 213, 176, 0.1) !important; 
            color: white !important; 
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--stream-green) !important;
            background: rgba(184, 213, 176, 0.08) !important;
            outline: none;
            box-shadow: 0 0 15px rgba(184, 213, 176, 0.1);
        }

        .stream-btn {
            background: var(--stream-green);
            color: var(--stream-dark);
            font-weight: 800;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stream-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .stream-btn:active { transform: translateY(0); }

        /* Custom Notification Toast */
        #custom-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 16px;
            background: #ff6b6b;
            color: #fff;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(-150%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 10000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #custom-toast.show { transform: translateY(0); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div id="custom-toast">
        <i id="toast-icon" class="fas fa-exclamation-circle"></i>
        <span id="toast-msg">Error Message</span>
    </div>

    <div class="glass w-full max-w-md rounded-[35px] p-10 md:p-12 text-center shadow-2xl">
        <div class="mb-8 flex flex-col items-center">
            <img src="logo.png" alt="Logo" class="h-12 mb-4 brightness-0 invert opacity-90">
            <h1 class="text-2xl font-black text-[#b8d5b0] uppercase tracking-widest">Welcome Back</h1>
            <p class="text-xs text-white/40 mt-1 uppercase tracking-wider font-semibold">Sign in to your account</p>
        </div>

        <form id="login-form" onsubmit="executeLogin(event)" class="space-y-5 text-left">
            <div class="relative">
                <label class="text-[10px] font-bold text-white/40 uppercase tracking-widest ml-1 mb-1.5 block">Email Address</label>
                <div class="relative">
                    <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-white/20 text-sm"></i>
                    <input type="email" id="login-user" required placeholder="Enter your email address" class="w-full pl-12 p-4 rounded-2xl outline-none text-sm">
                </div>
            </div>
            
            <div class="relative">
                <div class="flex justify-between items-center mb-1.5 px-1">
                    <label class="text-[10px] font-bold text-white/40 uppercase tracking-widest block">Password</label>
                    <a href="#" class="text-[10px] font-bold text-[#b8d5b0]/60 uppercase tracking-widest hover:text-[#b8d5b0] transition-colors">Forgot?</a>
                </div>
                <div class="relative">
                    <i class="fas fa-key absolute left-4 top-1/2 -translate-y-1/2 text-white/20 text-sm"></i>
                    <input type="password" id="login-pass" required placeholder="••••••••" class="w-full pl-12 p-4 rounded-2xl outline-none text-sm">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" id="submit-btn" class="w-full stream-btn p-4 rounded-2xl shadow-xl uppercase tracking-widest text-sm font-black">
                    Sign In
                </button>
            </div>
        </form>

        <div class="mt-8 border-t border-white/5 pt-6">
            <p class="text-xs text-white/30 font-semibold">
                Don't have an account? 
                <a href="#" class="text-[#b8d5b0] hover:underline font-bold ml-1">Create One</a>
            </p>
        </div>
    </div>

<script type="module">
    // Imported your specific Firebase v11 configurations
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCBasWo7DVLYV6WiP7TKEayMXLPeH3JLMs",
        authDomain: "streamafrica-7fc5d.firebaseapp.com",
        projectId: "streamafrica-7fc5d",
        storageBucket: "streamafrica-7fc5d.firebasestorage.app",
        messagingSenderId: "339049993823",
        appId: "1:339049993823:web:70d0e998269627d8646dea",
        measurementId: "G-R8VZ77T1J6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Custom notification toast controller
    function displayNotification(message, isError = true) {
        const toast = document.getElementById('custom-toast');
        const msgSpan = document.getElementById('toast-msg');
        const icon = document.getElementById('toast-icon');

        toast.style.background = isError ? '#ff6b6b' : '#b8d5b0';
        toast.style.color = isError ? '#ffffff' : '#0a1f1c';
        icon.className = isError ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
        
        msgSpan.innerText = message;
        toast.classList.add('show');
        
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3500);
    }

    // Submission handler bound to window to make it accessible to inline form attributes
    window.executeLogin = async (event) => {
        event.preventDefault();
        
        const emailInput = document.getElementById('login-user').value.trim();
        const passInput = document.getElementById('login-pass').value;
        const submitBtn = document.getElementById('submit-btn');

        if (emailInput === "" || passInput === "") {
            displayNotification("Please fill in all fields required", true);
            return;
        }

        // Change button state to show loading progress
        submitBtn.disabled = true;
        submitBtn.innerText = "Processing...";

        try {
            // signs the specific persistent user session directly into Firebase Auth
            await signInWithEmailAndPassword(auth, emailInput, passInput);
            
            displayNotification("Login Successful! Redirecting...", false);
            
            // Redirects to your newly updated checkout path to pull their correct premium/regular plans
            setTimeout(() => {
                window.location.href = "checkout.html";
            }, 1500);

        } catch (error) {
            console.error("Auth Failure:", error.code);
            submitBtn.disabled = false;
            submitBtn.innerText = "Sign In";

            // Map standard auth codes neatly into clear, customized toast errors
            if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                displayNotification("Invalid email address or password status", true);
            } else if (error.code === 'auth/invalid-email') {
                displayNotification("The email address format is invalid", true);
            } else if (error.code === 'auth/user-disabled') {
                displayNotification("This user profile account has been disabled", true);
            } else {
                displayNotification("Authentication error. Please try again", true);
            }
        }
    };
</script>
</body>
</html>
