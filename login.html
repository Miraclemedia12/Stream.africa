<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Stream Africa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;600;700;800&display=swap');
        
        :root { 
            --stream-green: #b8d5b0; 
            --stream-dark: #0a1f1c; 
        }

        body { 
            background: var(--stream-dark); 
            color: #fff; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-image: radial-gradient(circle at 50% 50%, rgba(184, 213, 176, 0.05) 0%, transparent 100%);
        }

        .glass { 
            background: rgba(255,255,255,0.02); 
            border: 2px solid rgba(184, 213, 176, 0.2); 
            backdrop-filter: blur(15px); 
        }

        input { 
            background: rgba(255,255,255,0.05) !important; 
            border: 1px solid rgba(184, 213, 176, 0.1) !important; 
            color: white !important; 
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--stream-green) !important;
            background: rgba(184, 213, 176, 0.08) !important;
            outline: none;
        }

        .stream-btn {
            background: var(--stream-green);
            color: var(--stream-dark);
            font-weight: 900;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stream-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .stream-btn:active { transform: translateY(0); }

        #toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 16px;
            background: #ff6b6b;
            color: #ffffff;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(-150%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 10000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #toast.show { transform: translateY(0); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div id="toast">
        <i class="fas fa-exclamation-circle"></i>
        <span id="toast-msg">Error message goes here</span>
    </div>

    <div id="login-card" class="glass w-full max-w-sm rounded-[35px] p-10 text-center">
        <div class="mb-8 flex flex-col items-center">
            <img src="logo.png" alt="Logo" class="h-10 mb-4 brightness-0 invert opacity-80">
            <h1 class="text-2xl font-black text-[#b8d5b0] uppercase tracking-widest">Master Admin</h1>
        </div>
        
        <form id="login-form" onsubmit="handleSubmit(event)" novalidate class="space-y-4">
            <div class="relative">
                <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-white/20 text-sm"></i>
                <input type="text" id="user" placeholder="Username" class="w-full pl-12 p-4 rounded-2xl outline-none">
            </div>
            
            <div class="relative">
                <i class="fas fa-key absolute left-4 top-1/2 -translate-y-1/2 text-white/20 text-sm"></i>
                <input type="password" id="pass" placeholder="Password" class="w-full pl-12 p-4 rounded-2xl outline-none">
            </div>
            
            <button type="submit" id="login-btn" class="w-full stream-btn p-4 rounded-2xl mt-4 shadow-xl">AUTHENTICATE</button>
        </form>
    </div>

<script>
    function showCustomAlert(message) {
        const toast = document.getElementById('toast');
        const msgSpan = document.getElementById('toast-msg');
        msgSpan.innerText = message;
        toast.classList.add('show');
        
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    function handleSubmit(event) {
        // Stop standard form submission and default browser actions
        event.preventDefault(); 
        
        const usernameInput = document.getElementById('user').value.trim();
        const passwordInput = document.getElementById('pass').value.trim();

        // Custom validation check instead of HTML5 popups
        if (!usernameInput) {
            showCustomAlert("Username cannot be blank!");
            return;
        }

        if (!passwordInput) {
            showCustomAlert("Password cannot be blank!");
            return;
        }

        // Handle your authentication logic below (Firebase, API redirect, etc.)
        console.log("Form values verified. Proceeding with login execution...");
    }
</script>
</body>
</html>
